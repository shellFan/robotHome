# 机器人之家 Nginx HTTPS 模板配置
# 使用前提：
#   1. 将 SSL 证书放置于 ./deploy/ssl/ 目录（fullchain.pem + privkey.pem）
#   2. 在 docker-compose.prod.yml 的 nginx 服务中映射 443 端口和证书目录：
#      ports:
#        - "${NGINX_HTTP_PORT:-80}:80"
#        - "${NGINX_HTTPS_PORT:-443}:443"
#      volumes 追加:
#        - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
#        - ./deploy/ssl:/etc/nginx/ssl:ro
#   3. .env 中设置 NGINX_SERVER_NAME=your-domain.com
# 证书申请：推荐使用 certbot (Let's Encrypt) 或云厂商免费证书

upstream robot_backend {
    server backend:8081;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# HTTP -> HTTPS 301 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    # --- SSL 证书 ---
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # --- SSL 加密策略（Mozilla Intermediate 兼容性） ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS（启用后浏览器强制 HTTPS，确认域名稳定后再开启） ---
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 安全响应头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 屏蔽 Swagger / API 文档 / Actuator 端点 ---
    location ~* ^/(swagger-ui|swagger-resources|v3/api-docs|doc\.html|webjars/) {
        return 404;
    }
    location ~* ^/actuator {
        return 404;
    }

    # --- SEO 服务端渲染页面 ---
    location ~ ^/(robots|brands|companies|categories|rankings|articles)/[A-Za-z0-9_-]+$ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://robot_backend/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://robot_backend/api/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # PC 网站（Vue SPA）
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
        index index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 管理后台
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # 后端 API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 上传文件
    location /files/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}