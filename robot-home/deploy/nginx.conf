# 机器人之家 Nginx 反向代理
# PC:     http://localhost/
# Admin:  http://localhost/admin/
# API:    http://localhost/api/
# 静态文件: http://localhost/files/  -> 后端 uploads

upstream robot_backend {
    server backend:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 25m;

    # --- 安全响应头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 屏蔽 Swagger / API 文档端点（生产环境） ---
    location ~* ^/(swagger-ui|swagger-resources|v3/api-docs|doc\.html|webjars/) {
        return 404;
    }

    # PC 网站（Vue SPA）
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # 管理后台（hash 路由，入口 /admin/）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # 后端 API（所有 /api/ 请求统一路由到 Server，包括 /api/admin/crawler/ 由 Server Gateway 代理到 Collector）
    # 注意：生产环境禁止浏览器直连 Collector，CRAWLER_API_KEY 由 Server 内部注入
    location /api/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 上传文件（本地存储模式）
    location /files/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
