# 机器人之家 Nginx 反向代理
# PC:     http://localhost/
# Admin:  http://localhost/admin/
# API:    http://localhost/api/
# 静态文件: http://localhost/files/  -> 后端 uploads

upstream robot_backend {
    server backend:8081;
    keepalive 32;
}

upstream robot_collector {
    server collector:8082;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 25m;

    # PC 网站（Vue SPA）
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # 管理后台（hash 路由，入口 /admin/）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # 采集器 API（路由到 collector 服务）
    location /api/crawler/ {
        proxy_pass http://robot_collector;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 上传文件（本地存储模式）
    location /files/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger / Knife4j（可选，生产可注释）
    location /swagger-ui/ {
        proxy_pass http://robot_backend;
    }
    location /v3/api-docs {
        proxy_pass http://robot_backend;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
