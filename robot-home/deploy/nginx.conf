# 机器人之家 Nginx 反向代理
# PC:     http://localhost/
# Admin:  http://localhost/admin/
# API:    http://localhost/api/
# 静态文件: http://localhost/files/  -> 后端 uploads

upstream robot_backend {
    server backend:8081;
    keepalive 32;
}

# API 分级限流策略：
# - api_limit:      普通查询 20r/s，突发40（正常浏览不被误伤）
# - auth_limit:     登录认证 5r/s，突发10（防暴力破解）
# - payment_limit:  支付回调 50r/s，突发100（支付商需要可靠投递，不过度限制）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=50r/s;

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 25m;
    # 隐藏 Nginx 版本号
    server_tokens off;

    # --- 安全响应头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 屏蔽 Swagger / API 文档 / Actuator 端点（生产环境） ---
    location ~* ^/(swagger-ui|swagger-resources|v3/api-docs|doc\.html|webjars/) {
        return 404;
    }
    location ~* ^/actuator {
        return 404;
    }

    # --- SEO 服务端渲染页面（爬虫可索引的公开详情页） ---
    # SPA 使用单数路径(/robot/:id)，SEO 使用复数路径(/robots/{slug})，两者不冲突
    # /robots.txt 由 /api/seo/robots.txt 提供，此处不拦截
    # 使用 ~ (区分大小写) 避免 /Robots/abc 等异常路径被代理到后端返回404而非SPA
    # 使用 $ 锚定结尾，避免 /robots/abc/def 等额外路径段被代理
    location ~ ^/(robots|brands|companies|categories|rankings|articles)/[A-Za-z0-9_-]+$ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sitemap.xml 和 robots.txt 代理到后端 SEO API
    location = /sitemap.xml {
        proxy_pass http://robot_backend/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://robot_backend/api/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # PC 网站（Vue SPA）
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
        index index.html;
        # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 管理后台（hash 路由，入口 /admin/）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # 登录认证接口（严格限流防暴力破解）
    location ~ ^/api/(auth/login|auth/register|auth/send-sms-code|auth/refresh|admin/auth/login) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 支付回调接口（高限额，支付商需要可靠投递）
    location ~ ^/api/payment/ {
        limit_req zone=payment_limit burst=100 nodelay;
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 后端 API（所有 /api/ 请求统一路由到 Server，包括 /api/admin/crawler/ 由 Server Gateway 代理到 Collector）
    # 注意：生产环境禁止浏览器直连 Collector，CRAWLER_API_KEY 由 Server 内部注入
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 上传文件（本地存储模式，公开文件）
    location /files/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
