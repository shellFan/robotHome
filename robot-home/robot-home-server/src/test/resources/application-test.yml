# 集成测试配置：使用 H2（MySQL 兼容模式）替代 MySQL，用于验证表结构与接口联通
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:robot_home;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 5000
  redis:
    host: localhost
    port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 测试密钥（仅用于测试环境）
jwt:
  secret: aB3dE7fG9hJ2kL5mN8pQ1rS4tU6vW0xYzI8jH4gF2dA6cB8
  expiration: 86400000
  refresh-expiration: 604800000

# 文件存储测试配置
file:
  storage-type: local
  local:
    upload-dir: ./test-uploads
    access-url: /files
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: robot-home

robot:
  sms-dev-mode: true
  login-max-retry: 5

# 采集器测试配置（仅用于 collector 模块测试）
crawler:
  api-key: test-api-key-for-unit-tests
  dev-mode: false

admin:
  init-username: admin
  init-password: admin123
