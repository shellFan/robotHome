# 机器人之家 — 生产环境编排
# 使用：docker compose -f docker-compose.prod.yml up -d --build
# 所有敏感配置通过 .env 文件提供，未设置时启动失败
# ⚠️ 切勿将 .env 文件提交到版本控制！

services:
  mysql:
    image: mysql:5.6
    container_name: robot-home-mysql
    restart: unless-stopped
    # 生产环境不暴露端口到宿主机，仅容器内网络可达
    # 如需调试可取消注释，但必须绑定 127.0.0.1
    # ports:
    #   - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD必须设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-robot_home}
      # MySQL docker 镜像自动创建业务账号并授予该库权限
      MYSQL_USER: ${MYSQL_APP_USERNAME:?MYSQL_APP_USERNAME必须设置}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD必须设置}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_init_data.sql:/docker-entrypoint-initdb.d/02_init_data.sql:ro
      - ./sql/03_demo_data.sql:/docker-entrypoint-initdb.d/03_demo_data.sql:ro
      - ./sql/04_migration_source_url.sql:/docker-entrypoint-initdb.d/04_migration_source_url.sql:ro
      - ./sql/05_brand_alias_and_indexes.sql:/docker-entrypoint-initdb.d/05_brand_alias_and_indexes.sql:ro
      - ./sql/06_real_brands_companies.sql:/docker-entrypoint-initdb.d/06_real_brands_companies.sql:ro
      - ./sql/07_real_robot_products.sql:/docker-entrypoint-initdb.d/07_real_robot_products.sql:ro
      - ./sql/08_search_indexes.sql:/docker-entrypoint-initdb.d/08_search_indexes.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2
    container_name: robot-home-redis
    restart: unless-stopped
    # 生产环境不暴露端口
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD必须设置}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-58Z
    container_name: robot-home-minio
    restart: unless-stopped
    # 生产环境不暴露端口（通过 Nginx 反代或仅内网访问）
    # ports:
    #   - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    #   - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY必须设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY必须设置}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./robot-home-server
      dockerfile: Dockerfile
    container_name: robot-home-backend
    restart: unless-stopped
    # 生产环境不直接暴露后端端口，仅通过 Nginx 反代访问
    # 如需调试可取消注释，但必须绑定 127.0.0.1
    # ports:
    #   - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-robot_home}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USERNAME:?MYSQL_APP_USERNAME必须设置}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD必须设置}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD必须设置}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET必须设置}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-minio}
      FILE_MINIO_ENDPOINT: http://minio:9000
      FILE_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY必须设置}
      FILE_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY必须设置}
      FILE_MINIO_BUCKET_NAME: ${MINIO_BUCKET:-robot-home}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?ADMIN_INIT_PASSWORD必须设置}
      ROBOT_SMS_DEV_MODE: "false"
      # Collector Gateway 配置 — Server 内部调用 Collector，不暴露 API Key 给浏览器
      COLLECTOR_URL: http://collector:8082
      COLLECTOR_API_KEY: ${CRAWLER_API_KEY:?CRAWLER_API_KEY必须设置}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/home/index?position=pc"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: robot-home-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./robot-home-web/dist:/usr/share/nginx/html/web:ro
      - ./robot-home-admin/dist:/usr/share/nginx/html/admin:ro
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  collector:
    build:
      context: ./robot-home-collector
      dockerfile: Dockerfile
    container_name: robot-home-collector
    restart: unless-stopped
    # 生产环境不直接暴露采集器端口，仅通过 Nginx 反代访问
    # 如需调试可取消注释，但必须绑定 127.0.0.1
    # ports:
    #   - "127.0.0.1:${COLLECTOR_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-robot_home}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USERNAME:?MYSQL_APP_USERNAME必须设置}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD必须设置}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD必须设置}
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:?CRAWLER_API_KEY必须设置}
      CRAWLER_DEV_MODE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  uploads_data: